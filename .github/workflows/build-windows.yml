
name: Build Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name "画像かんたん変換" image_resizer_v2.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: 画像かんたん変換-Windows-EXE
          path: dist/画像かんたん変換.exe
          if-no-files-found: error
